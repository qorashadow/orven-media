<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111114" />
      <stop offset="100%" stop-color="#0b0b0d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a0a0b0" />
    </linearGradient>
  </defs>

  <!-- Sharp Background Container -->
  <rect width="512" height="512" rx="4" fill="url(#bgGrad)" stroke="#26262c" stroke-width="8" />

  <!-- Geometric Sharp Monogram "OM" -->
  <g transform="translate(64, 96)" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Outer "O" Hexagonal / Octagonal Monolith -->
    <polygon points="96,0 288,0 384,96 384,224 288,320 96,320 0,224 0,96" />
    
    <!-- Inner Sharp "M" Structure -->
    <path d="M 80,240 L 80,100 L 192,210 L 304,100 L 304,240" stroke="#d9d9de" stroke-width="24" />
  </g>

  <!-- Precision Accent Lines -->
  <line x1="32" y1="32" x2="64" y2="32" stroke="#4f4f5a" stroke-width="4" />
  <line x1="32" y1="32" x2="32" y2="64" stroke="#4f4f5a" stroke-width="4" />
  <line x1="480" y1="480" x2="448" y2="480" stroke="#4f4f5a" stroke-width="4" />
  <line x1="480" y1="480" x2="480" y2="448" stroke="#4f4f5a" stroke-width="4" />
</svg>
